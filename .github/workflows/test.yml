name: Test

on:
  push:
    branches: [ main, linux ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkgs/multistockfish
    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.47.6'

    - name: Install dependencies
      run: flutter pub get

    - name: Run lifecycle regressions
      run: flutter test test/lifecycle_regression_test.dart

    - name: Analyze code
      run: flutter analyze lib test

    - name: Run tests
      run: flutter test
